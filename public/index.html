    <title>PokePay</title>
    <link rel="icon" type="image/png" href="/favicon.png">  <!-- 添加这一行 -->

    <link rel="stylesheet" href="/css/style.css">

    <style>
        /* 加载动画样式 */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .loading-overlay.hidden {
            display: none;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #e0e0e0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-text {
            margin-top: 16px;
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* 新增：默认隐藏两个页面 */
        #authPage {
            display: none;
        }
        #appPage {
            display: none;
        }
    </style>
</head>

<div id="loginForm">
    <div class="input-group">
        <label class="input-label">邮箱</label>
        <input type="email" id="loginEmail" class="input-field" placeholder="请输入您的邮箱">
    </div>
    <div class="input-group">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="input-label" style="margin-bottom: 0;">密码</label>
            <a href="#" onclick="showForgotPasswordModal(); return false;" style="color: #21c592; font-size: 13px; text-decoration: none;">忘记密码？</a>
        </div>
        <input type="password" id="loginPassword" class="input-field" placeholder="请输入您的登录密码">
    </div>
    <button id="doLoginBtn" class="btn btn-primary" style="margin-top: 16px;">登录</button>
    <div class="text-center mt-4">
        <a href="#" style="color: var(--accent-blue); text-decoration: none; font-size: 14px;" onclick="showSupportPage(true); return false;">联系客服</a>
    </div>
    <!-- 暂时隐藏下载App入口，如需恢复请去掉下面的注释
    <div style="text-align: center; margin-top: 16px;">
        <a href="https://download.pokepaycc3.com/poke.apk" 
           style="color: #21c592; text-decoration: none; font-size: 14px;"
           target="_blank"
           rel="noopener noreferrer">
            点击下载Poke国际App
        </a>
    </div>
    -->
</div>
                
<div id="registerForm" class="hidden">
    <!-- 邮箱输入（单独一行） -->
    <div class="input-group">
        <label class="input-label">邮箱</label>
        <input type="email" id="regEmail" class="input-field" placeholder="请输入您的邮箱">
    </div>

    <!-- 验证码 + 获取按钮（同一行） -->
    <div class="input-group">
        <label class="input-label">验证码</label>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="regVerificationCode" class="input-field" placeholder="请输入6位验证码" maxlength="6" inputmode="numeric" style="flex: 1; min-width: 0;">
            <button id="sendVerificationBtn" style="padding: 10px 16px; white-space: nowrap; font-size: 13px; background: #21c592; color: white; border: none; border-radius: 8px; cursor: pointer; min-width: 100px; flex-shrink: 0;">
                获取验证码
            </button>
        </div>
        <div id="verificationTip" style="font-size: 12px; color: #888; margin-top: 4px;">验证码有效期10分钟</div>
    </div>
    <div class="input-group">
        <label class="input-label">设置密码</label>
        <input type="password" id="regPassword" class="input-field" placeholder="创建密码">
    </div>
    <div class="input-group">
        <label class="input-label">确认密码</label>
        <input type="password" id="regConfirmPassword" class="input-field" placeholder="请再次输入密码">
    </div>
    <div class="input-group">
        <label class="input-label">国际银行编码 <span style="color: #e53e3e;">(必填)</span></label>
        <input type="text" id="regBankCode" class="input-field" placeholder="请输入银行编码" maxlength="3" inputmode="numeric">
    </div>
    <div class="input-group">
        <label class="input-label">推荐码 <span style="color: #888;">(选填)</span></label>
        <input type="text" id="regInviteCode" class="input-field" placeholder="请输入推荐码（选填）">
    </div>
    <!-- ========== 新增：同意协议 ========== -->
    <div style="display: flex; align-items: flex-start; gap: 8px; margin: 12px 0;">
        <input type="checkbox" id="regAgreeTerms" checked style="margin-top: 3px; width: 16px; height: 16px; cursor: pointer; accent-color: #21c592;">
        <label for="regAgreeTerms" style="font-size: 13px; color: #666; cursor: pointer; line-height: 1.6;">
            申请即同意PokePay的
            <a href="/about/privacy-policy.html" target="_blank" style="color: #21c592; text-decoration: none;">《隐私协议》</a>
            <a href="/about/service-agreement.html" target="_blank" style="color: #21c592; text-decoration: none;">《服务协议》</a>
        </label>
    </div>
    <!-- ========== 新增结束 ========== -->
    <button id="doRegisterBtn" class="btn btn-primary" style="margin-top: 16px;">注册</button>

</div>
            </div>
        </div>

        <!-- 主应用页面 -->
        <div id="appPage">
            
            <div class="main-content" id="tabContent"></div>
    
            <div class="bottom-nav">
                <button class="nav-item active" data-tab="home">
                    <div class="nav-icon"><i class="iconfont" style="font-size: 24px;">&#xe651;</i></div>
                    <span>首页</span>
                </button>
                <button class="nav-item" data-tab="card">
                    <div class="nav-icon"><i class="iconfont" style="font-size: 24px;">&#xe627;</i></div>
                    <span>卡片</span>
                </button>
                <button class="nav-item" data-tab="profile">
                    <div class="nav-icon"><i class="iconfont" style="font-size: 24px;">&#xe66a;</i></div>
                    <span>我的</span>
                </button>
            </div>
        </div>
        
        <!-- 隐藏的辅助元素 -->
        <div id="hasWallet" class="hidden"></div>
        <div id="noWallet" class="hidden"></div>
        <div id="walletAddress" class="hidden"></div>
        <div id="userEmail" class="hidden"></div>
        <div id="rewardBalance" class="hidden"></div>
        
        <!-- 模态框 -->
        <div id="dynamicModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3></h3>
                    <button class="modal-close" id="modalClose">×</button>
                </div>
                <div id="dynamicModalContent"></div>
            </div>
        </div>
        <div id="modalOverlay" class="modal hidden" style="background: rgba(0,0,0,0.5); z-index: 999;"></div>
        
        <!-- 加载动画 -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="loading-spinner"></div>
            <div class="loading-text">加载中...</div>
        </div>
    </div>
    <!-- 先加载语言包 -->
    <script src="/js/locales.js"></script>
    <!-- 再加载 app.js -->
    <script src="/js/app.js"></script>
